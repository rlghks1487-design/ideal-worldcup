name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: 준비된 월드컵 목록 만들기
        run: node .github/make-presets.js

      - name: Pages 준비
        uses: actions/configure-pages@v5

      - name: 사이트 파일 묶기
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: 사이트에 배포
        id: deployment
        uses: actions/deploy-pages@v4
